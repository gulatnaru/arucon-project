# Arucon v1.9: ASTRA_DIRECT for quality recovery/FUN (2026-09-28 user instruction).
# Historical child role definitions are preserved, but spawning is disabled.
model = "gpt-6-astra"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true

[agents]
enabled = false
max_concurrent_threads_per_session = 4
