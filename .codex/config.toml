# Arucon v1.9 multi-model autonomous defaults.
# Root = Astra orchestrator. Child roles explicitly pin cheaper/specialized models.
model = "gpt-6-astra"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true

[agents]
enabled = true
max_concurrent_threads_per_session = 4
